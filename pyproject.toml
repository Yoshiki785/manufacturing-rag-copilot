[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-rag-copilot"
version = "0.1.0"
description = "RAG-powered copilot for manufacturing domain knowledge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "openai>=1.10.0",
    "tiktoken>=0.5.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.8",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ignore rules that conflict with FastAPI patterns or create noise in tests
ignore = [
    "B008",   # FastAPI Depends() in function defaults is the recommended pattern
    "S101",   # Use of assert in tests is expected for pytest
    "S104",   # Binding to 0.0.0.0 is intentional for development server
]

[tool.ruff.lint.per-file-ignores]
# Additional ignores for test files
"tests/*" = [
    "S101",   # Assert usage in tests
    "B007",   # Unused loop variables in test contexts
    "SIM117", # Nested with statements are clearer in tests
]

[tool.mypy]
python_version = "3.11"
strict = true
